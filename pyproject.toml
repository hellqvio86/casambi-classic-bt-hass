[project]
name = "casambi-classic-bt-hass"
version = "0.3.7"
description = "Home Assistant custom integration for Casambi Classic networks using Bluetooth"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Olof Hellqvist", email = "olof.hellqvist@gmail.com"}
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
